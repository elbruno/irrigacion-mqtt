server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
    min-response-size: 1024

spring:
  datasource:
    # ⚠️ SOLO para desarrollo local sin Docker
    # En producción, estas se sobreescriben con variables de entorno
    # NUNCA usar estas credenciales en producción
    url: jdbc:postgresql://localhost:5433/irrigacion
    username: postgres
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: ${DB_POOL_MIN:5}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
      connection-init-sql: "SET TIME ZONE 'UTC'"
      data-source-properties:
        options: -c TimeZone=UTC
  jpa:
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true

# Actuator endpoints para health checks y métricas
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name:irrigacion-backend}

app:
  mqtt:
    enabled: ${APP_MQTT_ENABLED:true}
    host: ${APP_MQTT_HOST:localhost}
    port: ${APP_MQTT_PORT:1883}
    username: ${APP_MQTT_USERNAME:}
    password: ${APP_MQTT_PASSWORD:}
    tls: ${APP_MQTT_TLS:false}
    clientId: ${APP_MQTT_CLIENT_ID:}
  cors:
    # Configurar origins permitidos en producción
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
    max-age: 3600
